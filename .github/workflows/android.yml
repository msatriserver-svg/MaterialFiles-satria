name: Build APK (unsigned)

on:
  push:
    branches: [satria]
    paths-ignore: ['**.md', 'fastlane/**', 'art/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release (unsigned)
        run: ./gradlew --no-configuration-cache assembleRelease
      - name: Collect outputs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/
          cp app/build/outputs/mapping/release/mapping.txt out/
          grep -E "versionCode|versionName '" app/build.gradle | head -2 > out/version.txt
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned
          path: out/
          retention-days: 30
